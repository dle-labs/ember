name: Path Filter
description: Select validation and preview work from changed files
outputs:
  verify:
    description: Whether source, tests, dependencies or CI configuration changed
    value: ${{ steps.filter.outputs.verify }}
  preview:
    description: Whether app, package or deployment inputs changed
    value: ${{ steps.filter.outputs.preview }}
runs:
  using: composite
  steps:
    - id: filter
      uses: dorny/paths-filter@v3
      with:
        predicate-quantifier: every
        filters: |
          verify:
            - '{src/**,static/**,scripts/**,.github/scripts/**,*config*,vitest-setup-*,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,.npmrc,.node-version,.nvmrc,patches/**,.github/actions/**,.github/workflows/pull-request.yaml}'
          preview:
            - '{src/**,static/**,svelte.config.*,vite.config.*,tsconfig.json,wrangler.jsonc,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,.npmrc,.node-version,.nvmrc,patches/**,.github/actions/**,.github/workflows/pull-request.yaml}'
            - '!src/**/*.{test,spec}.{js,ts}'
            - '!src/tests/**'
