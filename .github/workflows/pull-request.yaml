name: Pull Request
on:
  pull_request:
  workflow_dispatch:
    inputs:
      force_deploy:
        default: false
        description: Force run all jobs
        required: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

env:
  NODE_VERSION: 24.7.0
  PNPM_VERSION: 10.17.1

jobs:
  verify:
    name: Verify
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 15
    outputs:
      preview: ${{ steps.paths.outputs.preview == 'true' || inputs.force_deploy }}
    steps:
      - uses: actions/checkout@v5
      - id: paths
        uses: ./.github/actions/path-filter
      - name: Setup environment
        if: steps.paths.outputs.verify == 'true' || steps.paths.outputs.preview == 'true' || inputs.force_deploy
        uses: ./.github/actions/env-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Restore ESLint cache
        if: steps.paths.outputs.verify == 'true' || inputs.force_deploy
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ runner.arch }}-${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', 'svelte.config.js') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ runner.arch }}-${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', 'svelte.config.js') }}-
      - name: Lint
        if: steps.paths.outputs.verify == 'true' || inputs.force_deploy
        run: pnpm lint --cache --cache-strategy content --cache-location .cache/eslint
      - name: Check types
        if: steps.paths.outputs.verify == 'true' || inputs.force_deploy
        run: pnpm check
      - name: Restore Chromium
        if: steps.paths.outputs.verify == 'true' || inputs.force_deploy
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Always ensure OS dependencies exist, including on a browser cache hit.
      - name: Install Chromium and system dependencies
        if: steps.paths.outputs.verify == 'true' || inputs.force_deploy
        run: pnpm exec playwright install --with-deps chromium
      - name: Test
        if: steps.paths.outputs.verify == 'true' || inputs.force_deploy
        run: pnpm test --browser.headless
      - name: Build
        if: steps.paths.outputs.preview == 'true' || inputs.force_deploy
        run: pnpm build
      - name: Upload preview
        if: (steps.paths.outputs.preview == 'true' || inputs.force_deploy) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: preview
          # The generated worker imports sibling output and cloudflare-tmp files.
          path: .svelte-kit
          include-hidden-files: true
          retention-days: 1

  publish:
    name: Publish
    environment: STAGING
    needs: verify
    if: needs.verify.outputs.preview == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup environment
        uses: ./.github/actions/env-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: preview
          path: .svelte-kit
      - name: Publish Web App
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
