name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  deployments: write

concurrency: ${{ github.workflow }}-${{ github.ref }}
env:
  NODE_VERSION: 24.22.2
  PNPM_VERSION: 12.16.1

jobs:
  publish:
    name: Publish
    timeout-minutes: 15
    environment: PRODUCTION
    runs-on: ubicloud-standard-2-ubuntu-2404
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/env-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - env:
          IS_CI: false
        name: Build
        run: |
          pnpm build
      - name: Publish Web App
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy
          # Optional: Enable this if you want to have GitHub Deployments triggered
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
      - name: Prepare release notes from CHANGELOG.md (Node)
        id: prepare_release
        run: |
          set -euo pipefail
          # run the JS ES module script directly with node (no dlx required)
          node .github/scripts/extract-release-notes.mts "${{ github.ref_name }}" > RELEASE_BODY.md
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat RELEASE_BODY.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Pack npm package
        run: |
          # npm pack will create a .tgz in the workspace. Rename it to a known name including the tag.
          npm pack --ignore-scripts
          ARTIFACT=$(ls *.tgz | head -n1)
          TAG="${{ github.ref_name }}"
          TARGET="package-${TAG}.tgz"
          mv "$ARTIFACT" "$TARGET"
          ls -lh "$TARGET"

      - name: Create sources archive for tag
        run: |
          TAG="${{ github.ref_name }}"
          ARCHIVE_NAME="sources-${TAG}.tar.gz"
          # Create a tarball of the repository at the tag
          git archive --format=tar.gz --output="$ARCHIVE_NAME" "$GITHUB_SHA"
          ls -lh "$ARCHIVE_NAME"

      - name: Create GitHub release and upload sources
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.prepare_release.outputs.body }}
          draft: false
          prerelease: false
          files: |
            sources-${{ github.ref_name }}.tar.gz
            package-${{ github.ref_name }}.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
